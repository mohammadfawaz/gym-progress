[package]
name = "lift-log"
version = "0.1.0"
edition = "2021"

[dependencies]
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlInputElement", "HtmlSelectElement"] }
yew = { version = "0.21", features = ["csr"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
